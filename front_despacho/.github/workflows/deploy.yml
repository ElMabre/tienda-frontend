name: CI/CD Frontend Pipeline
on:
  push:
    branches:
      - deploy
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Construir y Subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tienda-frontend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./front_despacho
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      - name: Despliegue en EC2 usando AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 447858402230.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 447858402230.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:latest",
              "docker stop tienda-frontend || true",
              "docker rm tienda-frontend || true",
              "docker run -d --name tienda-frontend -p 80:80 447858402230.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:latest"
            ]'